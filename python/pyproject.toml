[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ecommerce-search-rankings-mcp"
version = "0.2.1"
description = "Stdio MCP server: e-commerce search results and product rankings across amazon, ebay, walmart, google shopping, etsy via Apify's hosted MCP gateway"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "mcp-server", "apify"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=2.3,<3", "anyio>=4.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ecommerce-search-rankings-mcp = "ecommerce_search_rankings_mcp.server:main"

[project.urls]
Homepage = "https://github.com/GeminiGeorge22/ecommerce-search-rankings-mcp"
Source = "https://github.com/GeminiGeorge22/ecommerce-search-rankings-mcp/tree/main/python"
Issues = "https://github.com/GeminiGeorge22/ecommerce-search-rankings-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_search_rankings_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
